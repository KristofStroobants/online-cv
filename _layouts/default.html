---
layout: compress
---
<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body>
    <div class="app">
        <header class="top">
            <div class="brand">
                <a href="{{site.baseurl}}/" style="text-decoration:none; color:inherit;">Kristof Stroobants</a>
                <span class="brand-badge">CV / 2026</span>
            </div>
            <nav class="nav-steps">
                <a href="{{site.baseurl}}/#experience" class="nav-step">01 EXPERIENCE</a>
                <a href="{{site.baseurl}}/#skills" class="nav-step">02 SKILLS</a>
                <a href="{{site.baseurl}}/projects.html" class="nav-step {% if page.url contains 'projects' %}active{% endif %}" id="nav-projects-btn">03 PROJECTS</a>
            </nav>
            <button class="top-btn" onclick="window.print()">
                PRINT / SAVE PDF ↗
            </button>
        </header>

        <main class="work">
            {% include sidebar.html %}

            <section class="canvas">
                <div class="frames-container" id="frames" style="{% if page.url contains 'projects' %}display: block; min-height: auto;{% endif %}">
                    {{content}}
                </div>
            </section>
        </main>

        <footer class="palette">
            <strong>NAVIGATE / FILTER:</strong>
            <a href="{{site.baseurl}}/#experience" class="palette-btn">EXPERIENCE</a>
            <a href="{{site.baseurl}}/#skills" class="palette-btn">SKILLS</a>
            <a href="{{site.baseurl}}/projects.html" class="palette-btn {% if page.url contains 'projects' %}active{% endif %}" style="text-decoration:none;">⚡ ALL PROJECTS ↗</a>
            <span class="palette-counter" id="counter">ENGINEERING PORTFOLIO</span>
        </footer>
    </div>

    <!-- Backdrop Overlay for Enlarged Cards -->
    <div class="backdrop-overlay" id="backdrop"></div>

    {% include scripts.html %}
</body>
</html>

<!-- Custom Interactive JavaScript for Story Stack Theme -->
<script>
function copyEmail(email) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(showToast);
    } else {
        var dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = email;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        showToast();
    }
}

function showToast() {
    var toast = document.getElementById("toast");
    if (toast) {
        toast.classList.add("show");
        setTimeout(function() {
            toast.classList.remove("show");
        }, 2200);
    }
}

// Scroll-spy active link highlighting & drag-reorder simulation for blocks
document.addEventListener("DOMContentLoaded", function() {
    var sections = document.querySelectorAll(".block[id]");
    var navLinks = document.querySelectorAll(".rail-nav-link");

    window.addEventListener("scroll", function() {
        var current = "";
        sections.forEach(function(section) {
            var sectionTop = section.offsetTop - 120;
            if (window.pageYOffset >= sectionTop) {
                current = section.getAttribute("id");
            }
        });

        navLinks.forEach(function(link) {
            link.classList.remove("active");
            if (current && link.getAttribute("href") === "#" + current) {
                link.classList.add("active");
            }
        });
    });

    // Make story blocks draggable for fun stack ordering like 01-story-stack.html concept
    var blocks = document.querySelectorAll(".block");
    var dragBlock = null;

    blocks.forEach(function(block) {
        block.setAttribute("draggable", "true");

        block.addEventListener("dragstart", function(e) {
            dragBlock = block;
            block.style.opacity = "0.4";
            e.dataTransfer.effectAllowed = "move";
        });

        block.addEventListener("dragover", function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        });

        block.addEventListener("drop", function(e) {
            e.preventDefault();
            if (dragBlock && dragBlock !== block) {
                var parent = block.parentNode;
                var allBlocks = Array.from(parent.children);
                var dragIdx = allBlocks.indexOf(dragBlock);
                var dropIdx = allBlocks.indexOf(block);

                if (dragIdx < dropIdx) {
                    parent.insertBefore(dragBlock, block.nextSibling);
                } else {
                    parent.insertBefore(dragBlock, block);
                }
            }
        });

        block.addEventListener("dragend", function() {
            if (dragBlock) {
                dragBlock.style.opacity = "1";
                dragBlock = null;
            }
        });
    });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var framesContainer = document.querySelector("#frames");
    var paletteButtons = document.querySelectorAll(".palette-btn");
    var counterEl = document.querySelector("#counter");

    // Category Filtering
    paletteButtons.forEach(function(btn) {
        btn.addEventListener("click", function() {
            paletteButtons.forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");

            var filter = btn.getAttribute("data-filter");
            var frames = document.querySelectorAll(".frame");
            var visibleCount = 0;

            frames.forEach(function(frame) {
                var cat = frame.getAttribute("data-category");
                if (filter === "all" || cat === filter) {
                    frame.style.display = "flex";
                    visibleCount++;
                } else {
                    frame.style.display = "none";
                }
            });

            if (counterEl) {
                counterEl.textContent = visibleCount + " SCENES · " + (filter === "all" ? "DRAG TO REORDER" : "FILTERED BY " + filter.toUpperCase());
            }
        });
    });

    // Drag and drop reordering & selection
    var dragFrame = null;

    function initDragEvents(frame) {
        frame.addEventListener("dragstart", function(e) {
            dragFrame = frame;
            frame.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
        });

        frame.addEventListener("dragover", function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        });

        frame.addEventListener("drop", function(e) {
            e.preventDefault();
            if (dragFrame && dragFrame !== frame) {
                var allFrames = Array.from(framesContainer.children);
                var dragIdx = allFrames.indexOf(dragFrame);
                var dropIdx = allFrames.indexOf(frame);

                if (dragIdx < dropIdx) {
                    framesContainer.insertBefore(dragFrame, frame.nextSibling);
                } else {
                    framesContainer.insertBefore(dragFrame, frame);
                }
            }
        });

        frame.addEventListener("dragend", function() {
            if (dragFrame) {
                dragFrame.classList.remove("dragging");
                dragFrame = null;
            }
        });

        frame.addEventListener("click", function() {
            document.querySelectorAll(".frame").forEach(function(f) { f.classList.remove("selected"); });
            frame.classList.add("selected");
        });
    }

    document.querySelectorAll(".frame").forEach(initDragEvents);
});
</script>
